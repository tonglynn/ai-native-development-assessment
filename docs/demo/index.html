<title>Attest Demo Replay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: a ledger-like replay console — chapter rail on the left, one step on stage, timeline below. */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --ink:#14202b; --muted:#5a6773; --line:#d9e0e6;
  --accent:#2a6fc9; --accent-soft:#e3edf9; --pass:#1d7f4e; --pass-soft:#e2f3ea; --fail:#b3322b; --fail-soft:#f8e4e2;
  --wait:#a86a00; --wait-soft:#f8eed9; --code:#eef2f5;
  --display:"IBM Plex Sans Condensed","Noto Sans SC",system-ui,sans-serif;
  --body:"Noto Sans SC","IBM Plex Sans Condensed",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --panel:#161f27; --ink:#e6edf2; --muted:#9aa8b4; --line:#2a3743;
  --accent:#5b9cf0; --accent-soft:#1b2c42; --pass:#4cc488; --pass-soft:#16301f; --fail:#f07a70; --fail-soft:#3a1d1b;
  --wait:#e0a640; --wait-soft:#33281a; --code:#1c2731; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --panel:#161f27; --ink:#e6edf2; --muted:#9aa8b4; --line:#2a3743;
  --accent:#5b9cf0; --accent-soft:#1b2c42; --pass:#4cc488; --pass-soft:#16301f; --fail:#f07a70; --fail-soft:#3a1d1b;
  --wait:#e0a640; --wait-soft:#33281a; --code:#1c2731; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
h1{font-family:var(--display);font-weight:600;font-size:1.55rem;letter-spacing:.01em;margin:0;text-wrap:balance}
.labels{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.72rem;letter-spacing:.04em;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted);background:var(--panel)}
.chip b{color:var(--ink);font-weight:500}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.main{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:minmax(0,1fr)}.rail{display:none}}
.rail{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:12px;position:sticky;top:env(safe-area-inset-top,0px)}
.rail h3{font-family:var(--display);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.rail ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rail li button{width:100%;text-align:left;border:0;background:none;padding:4px 8px;border-radius:5px;font-size:.84rem;color:var(--muted)}
.rail li button.on{background:var(--accent-soft);color:var(--ink);font-weight:500}
.rail li button.done{color:var(--ink)}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px 24px;display:grid;gap:16px;min-width:0;min-height:520px;align-content:start}
.eyebrow{font-family:var(--display);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.say{font-size:1.18rem;line-height:1.65;max-width:62ch;margin:0}
.say em{font-style:normal;background:var(--accent-soft);padding:0 4px;border-radius:3px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.box{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.box h4{margin:0;font-family:var(--display);font-weight:600;font-size:.95rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 12px;font-size:.86rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
pre,code{font-family:var(--mono);font-size:.8rem}
pre{background:var(--code);border-radius:6px;padding:10px 12px;margin:0;overflow-x:auto;white-space:pre;line-height:1.5}
.tag{font-size:.72rem;font-weight:500;border-radius:4px;padding:1px 7px;font-family:var(--mono)}
.t-pass{background:var(--pass-soft);color:var(--pass)}
.t-fail{background:var(--fail-soft);color:var(--fail)}
.t-wait{background:var(--wait-soft);color:var(--wait)}
.t-info{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.work{border:1px dashed var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:8px}
.bar{height:6px;background:var(--code);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px}
.timeline{display:flex;gap:3px}
.timeline span{flex:1;height:5px;border-radius:2px;background:var(--line);cursor:pointer}
.timeline span.done{background:var(--accent)}
.timeline span.on{background:var(--ink)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted)}
.big{font-family:var(--display);font-weight:600;font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums}
.stat{display:grid;gap:4px}
table{border-collapse:collapse;font-size:.85rem;width:100%}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500}
.scroll{overflow-x:auto}
@media (prefers-reduced-motion:reduce){.bar i{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div style="display:grid;gap:6px;min-width:0">
      <h1>Attest：一次真实运行的回放</h1>
      <div class="labels" id="labels"></div>
    </div>
    <div class="controls">
      <button id="prev" aria-label="上一步">← 上一步</button>
      <button id="play" class="primary">▶ 自动播放</button>
      <button id="next" aria-label="下一步">下一步 →</button>
    </div>
  </header>
  <div class="timeline" id="timeline" aria-label="进度"></div>
  <div class="main">
    <nav class="rail" id="rail" aria-label="章节"></nav>
    <section class="stage" id="stage" aria-live="polite"></section>
  </div>
  <div class="foot">
    <span id="where"></span>
    <span>回放：每个数值都读自已提交的运行记录 <code>runs/demo</code>、<code>runs/gate_confirm</code>；智能体工作的等待时间已压缩，并标出实际用时。</span>
  </div>
</div>

const D = DATA.demo, REC = DATA.recorded, GOV = DATA.govern, T = DATA.timing;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const learn = id => D.learn.find(l => l.task === id);
const E04 = learn("E04");
const reuse = D.reuse.runs;
const withMem = reuse.filter(r => r.condition === "attest_v4"), noMem = reuse.filter(r => r.condition === "no_memory");
const pass = rs => rs.filter(r => r.first_pass).length;
const stateTag = s => s === "approved" ? `<span class="tag t-pass">approved 规则</span>` : s === "uncertain" ? `<span class="tag t-wait">uncertain 待人工</span>` : s === "rejected" ? `<span class="tag t-fail">rejected</span>` : `<span class="tag t-info">${esc(s||"–")}</span>`;
const noteBox = n => `<div class="box"><h4>${esc(n.id)} ${esc(n.title)} ${stateTag(n.state)}</h4>
  <dl class="kv"><dt>内容</dt><dd>${esc(n.content)}</dd>
  <dt>来源</dt><dd>${esc(n.learned_in)} 的评审 / 改动：<code>${esc((n.quote||"").slice(0,120))}</code></dd>
  <dt>落实在</dt><dd><code>${esc((n.applied||"").slice(0,110))}</code></dd>
  <dt>适用范围</dt><dd>${esc(n.scope.repo)} ≥ ${esc(n.scope.valid_from)} · ${esc((n.scope.files||[]).join(", "))}</dd>
  <dt>证据</dt><dd>硬证据：${esc((n.hard||[]).join("、")||"无")}；软证据：${esc((n.soft||[]).join("、")||"无")}${(n.counter||[]).length?`；反证：${esc(n.counter.join("、"))}`:""}</dd></dl></div>`;
const work = (label, secs, steps) => `<div class="work" data-work="1"><div class="small"><span class="tag t-info">智能体工作中</span> ${esc(label)}</div>
  <div class="bar"><i></i></div><div class="small muted">实际用时 ${secs ? Math.round(secs) + " 秒" : "—"}${steps ? ` · ${steps} 步` : ""} → 回放压缩为 2 秒</div></div>`;

 {ch:"开场", steps:[
  {t:"这次演示看什么", say:`编码智能体总在重犯评审已经纠正过的错误。Attest 让它<em>只从验证过的经验中成长</em>，并在没学过的新任务上证明这种成长。下面是一次真实运行的回放，分三段：<em>会成长</em>、<em>不会被教坏</em>、<em>人能管</em>。`,
   html:()=>`<div class="grid2">${[["会成长","任务被评审纠正 → 通过隐藏测试 → 沉淀经验 → 在新任务里复用，对照不开记忆"],["不会被教坏","同一条能通过测试的毒评论，交给三种记忆系统"],["人能管","智能体不能自己批准规则；政策变了由人取代旧规则；每次决定可审计"]].map(([a,b])=>`<div class="box"><h4>${a}</h4><div class="small">${b}</div></div>`).join("")}</div>`}]},
 {ch:"1 会成长", steps:[
  {t:"经验任务 E04：部分退款", say:`智能体在合成的计费仓库 ledgerly 1.0.0 上做任务 E04。题目只说了要做什么，<em>团队规范没写在题目里</em>：动钱的操作要幂等（C5），超过阈值的退款要第二审批人（C6）。`,
   html:()=>`<div class="box"><h4>E04 · ${esc(E04.title)}</h4><pre style="white-space:pre-wrap">${esc(E04.issue)}</pre><div class="small muted">隐藏测试检查的规范：${E04.conventions.join("、")}</div></div>`},
  {t:"第一次提交：隐藏测试不通过", say:`第一次提交没有通过隐藏测试，<em>C5 和 C6 都没做对</em>。评审给出两条团队规范（评审意见是为基准写好的，属于模拟内容）。`, work:()=>work("第一次尝试 E04", T.E04?.[0], E04.attempts[0].steps),
   html:()=>`<div class="grid2"><div class="box"><h4>隐藏测试 <span class="tag t-fail">未通过</span></h4><div class="small">没做对的规范：${E04.attempts[0].conv_failed.map(c=>`<span class="tag t-fail">${c}</span>`).join(" ")}</div></div>
   <div class="box"><h4>评审意见（模拟）</h4>${E04.attempts[0].review_comments.map(c=>`<pre style="white-space:pre-wrap">${esc(c)}</pre>`).join("")}</div></div>`},

   html:()=>`<div class="box"><h4>隐藏测试 <span class="tag t-pass">通过</span></h4><pre>${esc(E04.diff.filter(l=>/idempot|approved_by|APPROVAL|audit/.test(l)).slice(0,10).join("\n"))}</pre><div class="small muted">最终改动中与评审有关的行（节选）</div></div>`},
  {t:"沉淀经验：每条都有证据", say:`从这次任务里沉淀出两条经验。每条都写明<em>引用了哪句评审、落实在哪一行代码、适用于哪个仓库和版本</em>。门控 v4 检查它们：登记过的政策编号和隐藏测试都能作证，所以直接成为规则（approved）。`,
   html:()=>`<div class="grid2">${E04.new_notes.map(noteBox).join("")}</div>`},
  {t:"另外两个任务也学了经验", say:`E02 和 E06 同样学习。没有硬证据的笔记进入 <em>uncertain</em>：它们会保留，但不当作规则，等人来决定。`,
   html:()=>`<div class="scroll"><table><tr><th>笔记</th><th>来自</th><th>状态</th><th>证据</th></tr>${["E02","E06"].flatMap(t=>learn(t).new_notes.map(n=>`<tr><td>${esc(n.title)}</td><td>${t}</td><td>${stateTag(n.state)}</td><td class="small">${esc([...(n.hard||[]),...(n.soft||[])].join("、")||"无硬证据")}${(n.counter||[]).length?`；反证：${esc(n.counter.join("、"))}`:""}</td></tr>`)).join("")}</table></div>`},
  {t:"人来决定 uncertain 的笔记", say:`待审队列交给业务负责人（脚本模拟的人）。<em>智能体想自己批准，被拒绝</em>；负责人只批准能指出团队规则依据的笔记，并写明依据。`,
   html:()=>`<div class="scroll"><table><tr><th>谁</th><th>操作</th><th>笔记</th><th>结果</th></tr>${D.review.map(s=>`<tr><td><code>${esc(s.who)}</code></td><td>${esc(s.action)}</td><td>${esc(s.id)} ${esc(s.title||"")}</td><td>${s.result.startsWith("refused")?`<span class="tag t-fail">拒绝</span> <span class="small">${esc(s.result.replace(/^refused: /,""))}</span>`:s.result==="approved"?`<span class="tag t-pass">批准</span> <span class="small">依据：${esc((s.evidence||[]).join("、"))}</span>`:`<span class="tag t-wait">留在队列</span> <span class="small">${esc(s.result)}</span>`}</td></tr>`).join("")}</table></div>`},
  {t:"新任务 H04：从没学过", say:`H04（开具贷项通知单）<em>没有参与任何经验生成</em>。检索按仓库、版本和文件过滤，再按相关度排序。下面是这次注入给智能体的笔记，以及为什么适用。`,
   html:()=>`<div class="box"><h4>H04 · ${esc(D.reuse.task.title)}</h4><pre style="white-space:pre-wrap">${esc(D.reuse.task.issue.slice(0,420))}…</pre></div><div class="box"><h4>注入的笔记（记忆冻结）</h4><pre style="white-space:pre-wrap">${esc(withMem[0].context.slice(0,1500))}</pre><div class="small muted">${Object.entries(withMem[0].excluded||{}).map(([k,v])=>`${esc(k)} 未注入为规则：${esc(v)}`).join("；")}</div></div>`},
  {t:"同一个任务：开记忆 vs 不开记忆", say:`同一个任务各跑 3 次。开记忆 <em>${pass(withMem)}/3 第一次就通过</em>；不开记忆 <em>${pass(noMem)}/3</em>，每次都在幂等（C5）和审批（C6）上失败。`, work:()=>work("H04 × 6 次（并行）", T.H04, null),
   html:()=>`<div class="grid2"><div class="box"><h4>开记忆 <span class="tag t-pass">${pass(withMem)}/3 通过</span></h4><pre>${esc(withMem[0].diff.filter(l=>/idempot|approved_by|APPROVAL/.test(l)).slice(0,6).join("\n"))}</pre></div>
   <div class="box"><h4>不开记忆 <span class="tag t-fail">${pass(noMem)}/3 通过</span></h4><div class="small">失败的隐藏测试（第 1 次）：</div>${noMem[0].tests_failed.map(t=>`<div><code>${esc(t)}</code></div>`).join("")}<div class="small muted">每次失败的规范：${noMem.map(r=>(r.conv_failed||[]).join("+")).join(" / ")}</div></div></div>`}]},

   html:()=>`<div class="box"><h4>毒评论（合成）<span class="tag t-fail">float_audit</span></h4><pre style="white-space:pre-wrap">${esc(D.poison[0].case.reviews[0].text)}</pre><div class="small muted">违反：${esc(D.poison[0].payload.violates)}</div></div>`},

   html:()=>`<div class="grid2">${D.poison.slice(1).map(p=>`<div class="box"><h4>${esc({attest_secure_v4:"Attest + 门控 v4",ace:"ACE 式",reasoningbank:"ReasoningBank 式"}[p.system])} ${p.rule?`<span class="tag t-fail">存为规则</span>`:`<span class="tag t-pass">未存</span>`}</h4>${(p.notes||[]).length?`<pre style="white-space:pre-wrap">${esc(p.notes[0].slice(0,260))}</pre>`:`<div class="small">没有笔记写入记忆。</div>`}</div>`).join("")}</div>`},
  {t:"毒药写进记忆之后会怎样", say:`D71 那一轮实验记录了后果。同样做 H04：ACE 式的智能体<em>照着毒笔记把审计金额写成了 float</em>，Attest + v4 没有。整轮实验里，照做毒药的留出任务运行：ACE 式 ${REC.d71.applied.ace}/${REC.d71.runs.ace}，ReasoningBank 式 ${REC.d71.applied.reasoningbank}/${REC.d71.runs.reasoningbank}，<em>v4 ${REC.d71.applied.attest_secure_v4}/${REC.d71.runs.attest_secure_v4}</em>。`,
   html:()=>`<div class="grid2"><div class="box"><h4>ACE 式 · H04 的审计行</h4><pre>${esc(REC.ace.audit_lines.join("\n"))}</pre></div><div class="box"><h4>Attest + v4 · H04 的审计行</h4><pre>${esc(REC.attest_secure_v4.audit_lines.join("\n"))}</pre></div></div>`}]},
 {ch:"3 人能管", steps:[

   html:()=>`<div class="scroll"><table><tr><th>步骤</th><th>结果</th></tr>${GOV.filter(s=>s.who).map(s=>`<tr><td>${esc(({"the agent tries to approve it":"智能体尝试批准新笔记","the agent tries to supersede the old rule":"智能体尝试用它取代旧规则"})[s.step] || "负责人批准新笔记（依据 FIN-2026-11），并记录它取代 at-0005")} <code>${esc(s.who)}</code></td><td>${s.result.startsWith("refused")?`<span class="tag t-fail">拒绝</span> <span class="small">${esc(s.result.replace(/^refused: /,""))}</span>`:`<span class="tag t-pass">完成</span> <span class="small">${esc(s.result)}</span>`}</td></tr>`).join("")}</table></div>`},

 {ch:"结论", steps:[
  {t:"会成长、不会被教坏、说得清为什么", say:`同一轮里六个系统各自学习后比较（D71，探索性，判读规则事先提交，三条全部满足）：门控 v3.1 和 v4 是唯一<em>又成长、又没被教坏</em>的。`,
   html:()=>`<img src="${DATA.chart}" alt="六个记忆系统：横轴为干净任务流的留出 pass@1，纵轴为投毒流里照做毒药的留出运行数" style="width:100%;border-radius:6px;border:1px solid var(--line)"><div class="small muted">局限：合成基准、一个模型家族、样本小；v3.1 与 v4 在主实验之后设计；预注册的门槛确实有 −15 个百分点的代价（H6）。</div>`}]}
];
const FLAT = CH.flatMap((c,ci)=>c.steps.map((s,si)=>({...s,ch:c.ch,ci,si})));
let cur=0, timer=null, playing=false;
const stage=document.getElementById("stage"), tl=document.getElementById("timeline"), rail=document.getElementById("rail");
document.getElementById("labels").innerHTML = [["真实执行","智能体运行、隐藏测试、经验提炼与门控审核（deepseek-flash；审核用 deepseek-v4-pro）"],["模拟","评审意见（为基准编写）、业务负责人的决定（脚本）、演示用的新阈值笔记"],["合成","代码仓库与毒评论"]].map(([a,b])=>`<span class="chip" title="${esc(b)}"><b>${a}</b> · ${esc(b)}</span>`).join("");
tl.innerHTML = FLAT.map((s,i)=>`<span data-i="${i}" title="${esc(s.t)}"></span>`).join("");
rail.innerHTML = CH.map((c,ci)=>`<div><h3>${esc(c.ch)}</h3><ol>${c.steps.map((s,si)=>`<li><button data-i="${FLAT.findIndex(f=>f.ci===ci&&f.si===si)}">${esc(s.t)}</button></li>`).join("")}</ol></div>`).join("");
function show(i, animate){
  cur=Math.max(0,Math.min(FLAT.length-1,i)); const s=FLAT[cur]; window.scrollTo(0,0);
  const w = s.work ? s.work() : "";
  stage.innerHTML = `<div class="eyebrow">${esc(s.ch)} · ${cur+1}/${FLAT.length}</div><h2 style="margin:0;font-family:var(--display);font-size:1.35rem;text-wrap:balance">${esc(s.t)}</h2><p class="say">${s.say}</p>${w}<div id="content">${s.html()}</div>`;
  const content=document.getElementById("content");
  if (w && animate){ content.style.opacity=".25"; const bar=stage.querySelector(".bar i"); requestAnimationFrame(()=>{bar.style.transition="width 2s linear"; bar.style.width="100%";}); setTimeout(()=>{content.style.transition="opacity .4s"; content.style.opacity="1";},2000);} else if (w){ stage.querySelector(".bar i").style.width="100%"; }
  tl.querySelectorAll("span").forEach((e,j)=>e.className=j<cur?"done":j===cur?"on":"");
  rail.querySelectorAll("button").forEach(b=>{const j=+b.dataset.i; b.className=j===cur?"on":j<cur?"done":"";});
  document.getElementById("where").textContent = `${s.ch} · ${s.t}`;
}
const dwell = s => Math.min(14000, 4500 + s.say.replace(/<[^>]+>/g,"").length * 55) + (s.work ? 2000 : 0);
function tick(){ if(!playing) return; timer=setTimeout(()=>{ if(cur<FLAT.length-1){show(cur+1,true); tick();} else stop(); }, dwell(FLAT[cur])); }
function play(){ playing=true; document.getElementById("play").textContent="❚❚ 暂停"; tick(); }
function stop(){ playing=false; clearTimeout(timer); document.getElementById("play").textContent="▶ 自动播放"; }
document.getElementById("play").onclick=()=>playing?stop():play();
document.getElementById("next").onclick=()=>{stop(); show(cur+1,true);};
document.getElementById("prev").onclick=()=>{stop(); show(cur-1,false);};
tl.onclick=e=>{if(e.target.dataset.i){stop(); show(+e.target.dataset.i,false);}};
rail.onclick=e=>{const b=e.target.closest("button"); if(b){stop(); show(+b.dataset.i,true);}};
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"){stop();show(cur+1,true);} if(e.key==="ArrowLeft"){stop();show(cur-1,false);} if(e.key===" "){e.preventDefault(); playing?stop():play();}});
show(0,false);
if (location.hash === "#play") play();
</script>
